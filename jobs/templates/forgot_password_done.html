{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto mt-10 p-6 bg-surface-container rounded-lg shadow-lg border border-outline-variant/20">

    <h2 class="text-xl font-bold mb-4 text-center text-primary font-headline tracking-wide">
        Check Your Email
    </h2>

    <p class="text-sm text-center text-gray-400 mb-6">
        If an account exists with the email you entered, we’ve sent you instructions to reset your password.
        Please check your inbox (and spam folder).
    </p>

    <!-- Success Message -->
    <div class="bg-green-900/20 border border-green-500 text-green-300 text-sm p-3 rounded text-center mb-4">
        Password reset link sent successfully.
    </div>

    <!-- Back to Login -->
    <a href="{% url 'login' %}"
       class="block w-full text-center bg-white text-black px-4 py-2 rounded-lg font-bold
              uppercase tracking-widest hover:bg-gray-200 transition">
        Back to Login
    </a>

</div>

{% endblock %}
