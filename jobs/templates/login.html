{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto mt-10 p-6 bg-surface-container rounded-lg shadow-lg">
    <h2 class="text-xl font-bold mb-4 text-center text-primary">Login</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="text-red-400 text-sm text-center mb-2">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <!-- Username -->
        <input type="text" name="username" placeholder="Username" required
            class="w-full px-4 py-2 rounded bg-surface-container-high text-white border border-outline focus:outline-none">

        <!-- Password -->
        <input type="password" name="password" placeholder="Password" required
            class="w-full px-4 py-2 rounded bg-surface-container-high text-white border border-outline focus:outline-none">

        <!-- Forgot Password -->
        <div class="text-right">
            <a href="{% url 'forgot_password' %}"
               class="text-sm text-primary hover:underline">
                Forgot Password?
            </a>
        </div>

        <!-- Login Button -->
        <button class="w-full bg-white text-black px-4 py-2 rounded-lg font-bold hover:bg-gray-200 transition">
            Login
        </button>
    </form>

    <!-- Register Link -->
    <p class="text-sm text-center mt-4 text-gray-400">
        Don't have an account?
        <a href="{% url 'register' %}" class="text-primary hover:underline">Register</a>
    </p>
</div>

{% endblock %}
