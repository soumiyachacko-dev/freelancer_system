{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto mt-10 p-6 bg-surface-container rounded-lg shadow-lg border border-outline-variant/20">

    <h2 class="text-xl font-bold mb-4 text-center text-primary font-headline tracking-wide">
        Reset Password
    </h2>

    <p class="text-sm text-center text-gray-400 mb-6">
        Enter your email address and we’ll send you a link to reset your password.
    </p>

    {% if messages %}
        {% for message in messages %}
            <p class="text-red-400 text-sm text-center mb-2">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        <!-- Email -->
        <input type="email" name="email" placeholder="Enter your email" required
            class="w-full px-4 py-2 rounded bg-surface-container-high text-white
                   border border-outline focus:outline-none focus:border-primary transition">

        <!-- Submit Button -->
        <button class="w-full bg-white text-black px-4 py-2 rounded-lg font-bold
                       uppercase tracking-widest hover:bg-gray-200 transition">
            Send Reset Link
        </button>
    </form>

    <!-- Back to Login -->
    <p class="text-sm text-center mt-4 text-gray-400">
        Remember your password?
        <a href="{% url 'login' %}" class="text-primary hover:underline">
            Login
        </a>
    </p>

</div>

{% endblock %}
