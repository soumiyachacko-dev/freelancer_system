{% extends 'base.html' %}
{% block content %}

<main class="max-w-xl mx-auto p-6">

<h2 class="text-xl font-bold text-white mb-4">Edit Job</h2>

<form method="POST" class="space-y-4">
    {% csrf_token %}

    <input type="text" name="title" value="{{ job.title }}"
           class="w-full p-2 bg-[#2a2a2a] text-white rounded">

    <textarea name="description"
              class="w-full p-2 bg-[#2a2a2a] text-white rounded">{{ job.description }}</textarea>

    <input type="number" name="budget" value="{{ job.budget }}"
           class="w-full p-2 bg-[#2a2a2a] text-white rounded">
  <div>
        <label class="block text-sm text-gray-300 mb-1">Deadline</label>
        <input
            type="date"
            name="deadline"
            value="{{ job.deadline|date:'Y-m-d' }}"
            class="w-full p-2 bg-[#2a2a2a] text-white rounded"
        >
    </div>

    <button  class="px-5 py-2.5 text-sm font-bold uppercase tracking-widest
text-green-400 border border-green-500/40 rounded-lg
transition-all duration-300 ease-in-out
shadow-[0_0_8px_rgba(34,197,94,0.3)]
hover:bg-green-500 hover:text-white
hover:shadow-[0_0_18px_rgba(34,197,94,0.7)]">
        Update Job
    </button>

</form>

</main>

{% endblock %}
