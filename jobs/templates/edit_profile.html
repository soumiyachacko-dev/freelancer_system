{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto mt-12">

    <div class="bg-gradient-to-br from-[#1c1c1c] to-[#111] p-8 rounded-2xl border border-gray-800 shadow-xl">

        <!-- Header -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-white">Edit Profile</h2>
            <p class="text-gray-400 text-sm">Update your freelancer information</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <!-- Profile Image -->
            <div>
                <label class="block text-primary mb-2 font-semibold">Profile Image</label>

                <!-- Preview -->
                <div class="flex items-center gap-4 mb-3">
                    <img src="{% if profile.image %}{{ profile.image.url }}{% else %}/media/default.png{% endif %}"
                         class="w-16 h-16 rounded-full object-cover border-2 border-gray-700">
                                   </div>

                <input type="file" name="image"
                       class="w-full p-2 bg-black text-white border border-gray-700 rounded-lg">
            </div>

            <!-- Bio -->
            <div>
                <label class="block text-primary mb-2 font-semibold">Bio</label>
                <textarea name="bio" rows="4"
                          placeholder="Tell something about yourself..."
                          class="w-full p-3 bg-black/50 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition">{{ profile.bio }}</textarea>
            </div>

            <!-- Skills -->
            <div>
                <label class="block text-primary mb-2 font-semibold">Skills</label>
                <input type="text" name="skills"
                       value="{{ profile.skills }}"
                       placeholder="e.g. Python, Django, React"
                       class="w-full p-3 bg-black/50 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition">

                <p class="text-gray-500 text-xs mt-1">
                    Separate skills with commas
                </p>
            </div>

            <!-- Experience -->
            <div>
                <label class="block text-primary mb-2 font-semibold">Experience</label>
                <textarea name="experience" rows="5"
                          placeholder="Describe your experience..."
                          class="w-full p-3 bg-black/50 text-white border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition">{{ profile.experience }}</textarea>
            </div>

            <!-- Actions -->
            <div class="flex justify-between items-center pt-4">

                <!-- Cancel -->
                <a href="{% url 'freelancer_profile' user_id=request.user.id %}"
                   class="text-gray-400 hover:text-white transition">
                    ← Cancel
                </a>

                <!-- Save -->
                <button type="submit"
                        class="px-5 py-2.5 text-sm font-bold uppercase tracking-widest
    text-white border border-white/40 rounded-lg
    transition-all duration-300 ease-in-out
    shadow-[0_0_8px_rgba(255,255,255,0.2)]
    hover:bg-white hover:text-black
    hover:shadow-[0_0_18px_rgba(255,255,255,0.6)]
    hover:scale-105">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
